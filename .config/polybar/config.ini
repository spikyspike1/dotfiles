include-file = ~/.config/polybar/glyphs.ini

[colors]
background = #282A2E
background-alt = #373B41
foreground = #FFFFFF
primary = #FF66CC
;primary = #FF66CC
secondary = #8ABEB7
alert = #A54242
disabled = #707880

[bar/main]

;width = 98.86%
;offset-x = 0.6%
;offset-y = 0.6%

height = 32px
radius = 0

background = ${colors.background}
foreground = ${colors.foreground}
line-size = 0pt

padding-left = 12px
padding-right = 12px

border-top-size = 6px
border-bottom-size = 6px
border-top-color = ${colors.background}
border-bottom-color = ${colors.background}

separator-foreground = ${colors.disabled}

font-0 = Jetbrains Mono;2
font-1 = Symbols Nerd Font Mono:size=13;2
#font-2 = Symbols Nerd Font Mono:size=20;5
font-2 = JetBrainsMono Nerd Font Mono:size=18;5
font-3 = Symbols Nerd Font Mono:size=18;3

modules-left = right1 date left1 gap right1 pulseaudio mpd left1
modules-right = right1 updates wlan memory cpu temp battery left1 gap right1 archmenu left1
modules-center = right1 bspwm left1

enable-ipc = true
wm-restack = bspwm

#################################################################################

[module/tray]
type = internal/tray
format = <tray>
format-background = ${colors.background-alt}
tray-background = ${colors.background-alt}
tray-spacing = 8pt

[module/temp]
type = internal/temperature
interval = 1
thermal-zone = 0
hwmon-path = /sys/devices/virtual/thermal/thermal_zone0/hwmon1/temp1_input
base-temperature = 45
warn-temperature = 90
units = true
#label = "%temperature-c% "
label-warn = "%temperature-c% "
label = ""
format = <ramp> <label>
format-warn = <ramp> <label-warn>
format-background = ${colors.background-alt}
format-warn-background = ${colors.background-alt}
ramp-0 = 󱃃
ramp-1 = 󱃃
ramp-2 = 󱃃
ramp-3 = 󱃃
ramp-4 = 󰔏
ramp-5 = 󰔏
ramp-6 = 󰔏
ramp-7 = 󱃂
ramp-8 = 󱃂
ramp-9 = 󱃂
ramp-10 = 󱃂
ramp-0-foreground = #009933
ramp-1-foreground = #009933
ramp-2-foreground = #33cc33
ramp-3-foreground = #00ff00
ramp-4-foreground = #ccff66
ramp-5-foreground = #ffff00
ramp-6-foreground = #ffcc66
ramp-7-foreground = #ff8800
ramp-8-foreground = #ff0000
ramp-9-foreground = #ff00ff
ramp-10-foreground = #ff00ff

[module/notif]
type = custom/ipc
hook-0 = echo " "
hook-1 = echo " "
initial=1
format = <output>
format-background = ${colors.background-alt}
click-left = if [[ $(dunstctl is-paused) = "false" ]]; then dunstctl set-paused true && polybar-msg hook notif 2; else dunstctl set-paused false && polybar-msg hook notif 1; fi

[module/bspwm]
type = internal/bspwm
label-active = %{T4}%{T-}
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 3px

label-occupied = %{T4}%{T-}
label-occupied-padding = 3px
label-occupied-background = ${colors.background-alt}
label-occupied-foreground = ${colors.disabled}
label-urgent = %{T4}%{T-}
label-urgent-background = ${colors.alert}
label-urgent-padding = 3px

label-empty = %{T4}%{T-}
label-empty-foreground = ${colors.disabled}
label-empty-background = ${colors.background-alt}
label-empty-padding = 3px
enable-click = false
enable-scroll = false

[module/xwindow]
type = internal/xwindow
label = "  %class% "
label-background = ${colors.background-alt}
label-maxlen = 30
label-empty = " empty "
label-empty-background = ${colors.background-alt}

[module/updates]
type = custom/script
exec = ~/.config/polybar/scripts/updates.sh
interval = 15
format-padding = 1px
format-suffix = " "
format-background = ${colors.background-alt}

[fs-base]
type = internal/fs
fixed-values = true
interval = 25

[module/fs-home]
inherit = fs-base
mount-0 = /home
format-mounted = <ramp-capacity>
ramp-capacity-0 = /󰋜
ramp-capacity-1 = /󰋜
ramp-capacity-2 = /󰋜
ramp-capacity-3 = /󰋜
ramp-capacity-4 = /󰋜
ramp-capacity-5 = /󰋜
ramp-capacity-6 = /󰋜
ramp-capacity-7 = /󰋜
ramp-capacity-8 = /󰋜
ramp-capacity-9 = /󰋜
ramp-capacity-10 = /󰋜
ramp-capacity-0-foreground = #cc0000
ramp-capacity-1-foreground = #ff0000
ramp-capacity-2-foreground = #ff5000
ramp-capacity-3-foreground = #ff8800
ramp-capacity-4-foreground = #ffcc66
ramp-capacity-5-foreground = #ffff00
ramp-capacity-6-foreground = #ccff66
ramp-capacity-7-foreground = #00ff00
ramp-capacity-8-foreground = #33cc33
ramp-capacity-9-foreground = #009933
ramp-capacity-10-foreground = #009933

[module/fs-root]
inherit = fs-base
mount-0 = /
format-mounted = <ramp-capacity>
ramp-capacity-0 = /
ramp-capacity-1 = /
ramp-capacity-2 = /
ramp-capacity-3 = /
ramp-capacity-4 = /
ramp-capacity-5 = /
ramp-capacity-6 = /
ramp-capacity-7 = /
ramp-capacity-8 = /
ramp-capacity-9 = /
ramp-capacity-10 = /
ramp-capacity-0-foreground = #cc0000
ramp-capacity-1-foreground = #ff0000
ramp-capacity-2-foreground = #ff5000
ramp-capacity-3-foreground = #ff8800
ramp-capacity-4-foreground = #ffcc66
ramp-capacity-5-foreground = #ffff00
ramp-capacity-6-foreground = #ccff66
ramp-capacity-7-foreground = #00ff00
ramp-capacity-8-foreground = #33cc33
ramp-capacity-9-foreground = #009933
ramp-capacity-10-foreground = #009933

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "󰕾 "
format-volume-prefix-foreground = ${colors.foreground}
format-volume = <label-volume>
format-volume-suffix = " "
label-volume = %percentage%

label-muted = 󰖁 %percentage%
label-muted-foreground = ${colors.foreground}
format-muted-suffix = " "
format-volume-background = ${colors.background-alt}
format-muted-background = ${colors.background-alt}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = scroll lock
label-layout-background = ${colors.background-alt}
label-layout = "  %layout% "
#label-layout-foreground = ${colors.foreground}
label-indicator-on-capslock = " CL "
label-indicator-on-capslock-background = ${colors.background-alt}
#label-indicator-foreground = ${colors.background}
#label-indicator-background = ${colors.background-alt}

[module/memory]
type = internal/memory
interval = 1
label = %percentage_used%%
format = <ramp-used>
format-suffix = " "
format-background = ${colors.background-alt}
ramp-used-0 = 
ramp-used-1 = 
ramp-used-2 = 
ramp-used-3 = 
ramp-used-4 = 
ramp-used-5 = 
ramp-used-6 = 
ramp-used-7 = 
ramp-used-8 = 
ramp-used-9 = 
ramp-used-10 = 
ramp-used-11 = 
ramp-used-12 = 
ramp-used-13 = 
ramp-used-14 = 
ramp-used-15 = 
ramp-used-16 = 
ramp-used-17 = 
ramp-used-0-foreground = #009933
ramp-used-1-foreground = #009933
ramp-used-2-foreground = #009933
ramp-used-3-foreground = #33cc33
ramp-used-4-foreground = #33cc33
ramp-used-5-foreground = #00ff00
ramp-used-6-foreground = #ccff66
ramp-used-7-foreground = #ffff00
ramp-used-8-foreground = #ffcc66
ramp-used-9-foreground = #ff8800
ramp-used-10-foreground = #ff5000
ramp-used-11-foreground = #ff0000
ramp-used-12-foreground = #ff00ff
ramp-used-13-foreground = #ff00ff
ramp-used-14-foreground = #ffffff
ramp-used-15-foreground = #ffffff
ramp-used-16-foreground = #ffffff
ramp-used-17-foreground = #ffffff

[module/cpu]
type = internal/cpu
interval = 1
label = %percentage%%
format = <ramp-load>
format-suffix = " "
format-background = ${colors.background-alt}
ramp-load-0 = 
ramp-load-1 = 
ramp-load-2 = 
ramp-load-3 = 
ramp-load-4 = 
ramp-load-5 = 
ramp-load-6 = 
ramp-load-7 = 
ramp-load-8 = 
ramp-load-9 = 
ramp-load-0-foreground = #009933
ramp-load-1-foreground = #33cc33
ramp-load-2-foreground = #00ff00
ramp-load-3-foreground = #ccff66
ramp-load-4-foreground = #ffff00
ramp-load-5-foreground = #ffcc66
ramp-load-6-foreground = #ff8800
ramp-load-7-foreground = #ff5000
ramp-load-8-foreground = #ff0000
ramp-load-9-foreground = #ff00ff

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
format-suffix = " "
format-connected-suffix = " "
format-disconnected-suffix = " "
format-background = ${colors.background-alt}
format-connected-background = ${colors.background-alt}
format-disconnected-background = ${colors.background-alt}
ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤯
ramp-signal-2 = 󰤟
ramp-signal-3 = 󰤟
ramp-signal-4 = 󰤢
ramp-signal-5 = 󰤢
ramp-signal-6 = 󰤥
ramp-signal-7 = 󰤥
ramp-signal-8 = 󰤨
ramp-signal-9 = 󰤨
ramp-signal-0-foreground = #ff0000
ramp-signal-1-foreground = #ff8800
ramp-signal-2-foreground = #ffcc66
ramp-signal-3-foreground = #ffff00
ramp-signal-4-foreground = #ccff66
ramp-signal-5-foreground = #00ff00
ramp-signal-6-foreground = #33cc33
ramp-signal-7-foreground = #33cc33
ramp-signal-8-foreground = #009933
ramp-signal-9-foreground = #009933
label-disconnected-foreground = #ffffff
format-connected = <ramp-signal>
label-disconnected = 󰤮
interval = 1

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674}%ifname%%{F-} %local_ip%

[module/date]
type = internal/date
interval = 1
#date-alt =  %a %d.%m.%y  %H:%M:%S
date =  %a %d.%m.%y  %H:%M:%S
format-background = ${colors.background-alt}
format-padding = 1px

[module/archmenu]
type = custom/menu
label-close = " "
label-open = "󰐥"
expand-right = true
menu-0-0 = "󰍃 "
menu-0-0-exec = "bspc quit"
menu-0-1 = "󰤁 "
menu-0-1-exec = systemctl poweroff
menu-0-2 = "󰑓"
menu-0-2-exec = systemctl reboot
format-background = ${colors.background-alt}

[module/mpd]
type = internal/mpd
format-paused = "󰝛 <label-song> <icon-single>"
format-stopped = "󰝛 Nothing <icon-single>"
format-online = "󰝚 <label-song> <icon-single>"
format-offline = " mpd is offline"
bar-progress-width = 10
bar-progress-indicator = |
bar-progress-fill = ━
bar-progress-empty = ─
interval = 1
icon-single = 󰑘
icon-random = 
icon-repeat = 󰑖
toggle-on-foreground = #00ff00
toggle-off-foreground = #ff6666
label-song = "%title%"
label-time = "%elapsed% / %total%"
format-online-background = ${colors.background-alt}
format-offline-background = ${colors.background-alt}
format-paused-background = ${colors.background-alt}
format-stopped-background = ${colors.background-alt}
format-offline-padding = 2px

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC0
poll-interval = 3
full-at = 99
low-at = 10
label = %percentage%%
label-full = 󰁹 
label-full-foreground = #009933
label-low = %percentage%%
label-charging =
format-background = ${colors.background-alt}
format-full-background = ${colors.background-alt}
format-charging-background = ${colors.background-alt}
format-low-background = ${colors.background-alt}
animation-charging-0 = 󰢜
animation-charging-1 = 󰂆
animation-charging-2 = 󰂇
animation-charging-3 = 󰂈
animation-charging-4 = 󰢝
animation-charging-5 = 󰂉
animation-charging-6 = 󰢞
animation-charging-7 = 󰂊
animation-charging-8 = 󰂋
animation-charging-9 = 󰂅
animation-charging-framerate = 500

format-charging = <ramp-capacity>󱐋

ramp-capacity-0 = 󰂎
ramp-capacity-1 = 󰁺
ramp-capacity-2 = 󰁻
ramp-capacity-3 = 󰁼
ramp-capacity-4 = 󰁽
ramp-capacity-5 = 󰁾
ramp-capacity-6 = 󰁿
ramp-capacity-7 = 󰂀
ramp-capacity-8 = 󰂁
ramp-capacity-9 = 󰂂
ramp-capacity-10 = 󰁹
ramp-capacity-1-foreground = #cc0000
ramp-capacity-2-foreground = #ff0000
ramp-capacity-3-foreground = #ff5000
ramp-capacity-4-foreground = #ff8800
ramp-capacity-5-foreground = #ffcc66
ramp-capacity-6-foreground = #ffff00
ramp-capacity-7-foreground = #ccff66
ramp-capacity-8-foreground = #00ff00
ramp-capacity-9-foreground = #33cc33
ramp-capacity-10-foreground = #009933
animation-low-0 = "󰂃"
animation-low-1 = "󰁺"
animation-low-framerate = 500

format-low = <animation-low> <label-low>
format-discharging = <ramp-capacity>
format-discharging-background = ${colors.background-alt}
format-low-foreground = #cc0000

[settings]
screenchange-reload = true
pseudo-transparency = true
; vim:ft=dosini
