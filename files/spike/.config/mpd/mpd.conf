music_directory     "~/music"
playlist_directory  "~/music/playlists"
db_file "~/.local/share/mpd/database"
log_file            "~/.config/mpd/mpd.log"
pid_file            "~/.local/share/mpd/pid"
state_file          "~/.local/share/mpd/state"

bind_to_address     "127.0.0.1"
port                "6600"

auto_update         "yes"
restore_paused      "yes"
audio_output {
    type            "pulse"
    mixer_type      "software"
    name            "PulseAudio"
}

audio_output {
    type            "alsa"
    mixer_type      "software"
    name            "ALSA"
}
audio_output {
        type "fifo"
        name "visualizer"
        path "/tmp/mpd.fifo"
        format "44100:16:2"
}
