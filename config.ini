[colors]
background = #282A2E
background-alt = #373B41
foreground = #FFFFFF
primary = #FF66CC
;primary = #FF66CC
secondary = #8ABEB7
alert = #A54242
disabled = #707880

[bar/example]
;width = 98.86%
;offset-x = 0.6%
;offset-y = 0.6%
height = 21pt
radius = 0
; dpi = 96
background = ${colors.background}
foreground = ${colors.foreground}
;line-size = 3pt
line-size = 0pt
border-size = 0pt
;border-size = 2pt
border-color = #FF66CC

padding-left = 0
padding-right = 1

module-margin = 1

#separator = |
separator-foreground = ${colors.disabled}
font-0 = Jetbrains Mono;2
font-1 = "Symbols Nerd Font Mono:size=13;2"
font-2 = "Untitled1:size=15;2"
font-3 = monospace;2
modules-left = xworkspaces pulseaudio mpd
modules-right = wlan cpu1 mem battery archmenu
modules-center = date
;modules-center = archmenu
; modules-center = void
;cursor-click = false
;cursor-click = pointer
;cursor-scroll = ns-resize
enable-ipc = true
; wm-restack = generic
wm-restack = bspwm
; wm-restack = i3

;override-redirect = true
;
; This module is not active by default (to enable it, add it to one of the
; modules-* list above).
; Please note that only a single tray can exist at any time. If you launch
; multiple bars with this module, only a single one will show it, the others
; will produce a warning. Which bar gets the module is timing dependent and can
; be quite random.
; For more information, see the documentation page for this module:
; https://polybar.readthedocs.io/en/stable/user/modules/tray.html
[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/xworkspaces
label-active = %{T4}%name%%{T-}
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %{T4}%name%%{T-}
label-occupied-padding = 1

label-urgent = %{T4}%name%%{T-}
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %{T4}%name%%{T-}
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1
[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%
[module/temperature]
type = internal/temperature
thermal-zone = 0
hwmon-path = /sys/class/hwmon/hwmon0/temp1_input
interval = 2
label = %temperature-c%
[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /
mount-1 = /home
label-mounted = %mountpoint%%{F-} %used%

label-unmounted = %mountpoint%
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "󰕾 "
format-volume-prefix-foreground = ${colors.foreground}
format-volume = <label-volume>

label-volume = %percentage%

label-muted = 󰖁 %percentage%
label-muted-foreground = ${colors.foreground}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock

label-layout = %layout%
label-layout-foreground = ${colors.foreground}

label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}
[module/mem]
type = custom/script
exec = /etc/polybar/mem.sh
interval = 1
[module/cpu1]
type = custom/script
exec = /etc/polybar/cpu.sh
interval = 1
[module/memory]
type = internal/memory
interval = 1
format-prefix = " "
format-prefix-foreground = ${colors.foreground}
label = %mb_used:2%
[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.foreground}
label = %percentage:01%%

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
ramp-signal-0 = 󰤟
ramp-signal-1 = 󰤢
ramp-signal-2 = 󰤥
ramp-signal-3 = 󰤨
format-connected = <ramp-signal>
label-disconnected = 󰤭
interval = 1
[module/arch]
type = custom/text
;label = "%{A1:rofi -show run &:}%{A}"
;label = "%{T3}%{T-} Arch Linux x86_64"
label = "%{T3} %{T-}Artix Linux x86_64"

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674}%ifname%%{F-} %local_ip%

[module/date]
type = internal/date
interval = 1
date-alt =  %d.%m.%y  %H:%M:%S
date =  %d.%m.%y  %H:%M
[module/archmenu]
type = custom/menu
#label-close = " Arch Linux x86_64 "
label-close = " "
#label-open = "⋯"
label-open = "󰐥"
expand-right = true
menu-0-0 = "󰍃 "
menu-0-0-exec = "bspc quit"
menu-0-1 = "󰤁 "
menu-0-1-exec = systemctl poweroff
menu-0-2 = 󰑓
menu-0-2-exec = systemctl reboot
[module/mpd]
type = internal/mpd
format-paused = "󰝛 <label-song> <icon-single>"
format-stopped = "󰝛 Nothing <icon-single>"
format-online = "󰝚 <label-song> <icon-single>"
bar-progress-width = 10
bar-progress-indicator = |
bar-progress-fill = ━
bar-progress-empty = ─
interval = 1
icon-single = 󰑖
toggle-off-foreground=${colors.background}
label-song = "%title%"
[module/updates]
type = custom/script
exec = checkupdates | grep -q . && echo ""
interval = 15
label = %output%
[module/battery]
type = internal/battery
battery = BAT0
adapter = AC0
poll-interval = 1
full-at = 99
low-at = 10
label-full = "󰁹"
label-low = %percentage%%
label-charging =

animation-charging-0 = 󰢜
animation-charging-1 = 󰂆
animation-charging-2 = 󰂇
animation-charging-3 = 󰂈
animation-charging-4 = 󰢝
animation-charging-5 = 󰂉
animation-charging-6 = 󰢞
animation-charging-7 = 󰂊
animation-charging-8 = 󰂋
animation-charging-9 = 󰂅
animation-charging-framerate = 500

format-charging = <ramp-capacity>󱐋

ramp-capacity-0 = 󰂎
ramp-capacity-1 = 󰁺
ramp-capacity-2 = 󰁻
ramp-capacity-3 = 󰁼
ramp-capacity-4 = 󰁽
ramp-capacity-5 = 󰁾
ramp-capacity-6 = 󰁿
ramp-capacity-7 = 󰂀
ramp-capacity-8 = 󰂁
ramp-capacity-9 = 󰂂
ramp-capacity-10 = 󰁹

animation-low-0 = "󰂃"
animation-low-1 = "󰁺"
animation-low-framerate = 500

format-low = <animation-low> <label-low>
format-discharging = <ramp-capacity>
format-low-foreground = #ff0000
[settings]
screenchange-reload = true
pseudo-transparency = true
; vim:ft=dosini
