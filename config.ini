[colors]
background = #282A2E
background-alt = #373B41
foreground = #FFFFFF
primary = #FF66CC
;primary = #FF66CC
secondary = #8ABEB7
alert = #A54242
disabled = #707880

[bar/example]
;width = 98.86%
;offset-x = 0.6%
;offset-y = 0.6%
height = 21pt
radius = 0
; dpi = 96
background = ${colors.background}
foreground = ${colors.foreground}
;line-size = 3pt
line-size = 0pt
border-size = 0pt
;border-size = 2pt
border-color = #FF66CC

padding-left = 0
padding-right = 1

module-margin = 1

#separator = |
separator-foreground = ${colors.disabled}
font-0 = Jetbrains Mono;2
font-1 = "Symbols Nerd Font Mono:size=13;2"
modules-left = xworkspaces xwindow pulseaudio mpd
modules-right = xkeyboard updates wlan memory cpu battery archmenu
modules-center = date
;cursor-click = false
;cursor-click = pointer
;cursor-scroll = ns-resize
enable-ipc = true
; wm-restack = generic
wm-restack = bspwm

;override-redirect = true
;
; This module is not active by default (to enable it, add it to one of the
; modules-* list above).
; Please note that only a single tray can exist at any time. If you launch
; multiple bars with this module, only a single one will show it, the others
; will produce a warning. Which bar gets the module is timing dependent and can
; be quite random.
; For more information, see the documentation page for this module:
; https://polybar.readthedocs.io/en/stable/user/modules/tray.html

[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt
[module/xworkspaces]
type = internal/xworkspaces
label-active = 
label-active-background = ${colors.background-alt}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = 
label-occupied-padding = 1

label-urgent = 
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = 
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1
enable-click = false
enable-scroll = false
[module/xwindow]
type = internal/xwindow

label = "  %class% "
label-background = ${colors.background-alt}
label-maxlen = 30
label-empty = " empty "
label-empty-background = ${colors.background-alt}

[module/updates]
type = custom/script
exec = /etc/polybar/updates.sh
interval = 15

[module/temperature]
type = internal/temperature
thermal-zone = 0
hwmon-path = /sys/devices/platform/coretemp.0/hwmon/hwmon4/temp1_input
interval = 2
label = %temperature-c%
[module/filesystem]
type = internal/fs
interval = 25

mount-0 = /
mount-1 = /home
label-mounted = %mountpoint%%{F-} %used%

label-unmounted = %mountpoint%
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio

format-volume-prefix = "󰕾 "
format-volume-prefix-foreground = ${colors.foreground}
format-volume = <label-volume>

label-volume = %percentage%

label-muted = 󰖁 %percentage%
label-muted-foreground = ${colors.foreground}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = scroll lock
label-layout = 
label-layout-foreground = ${colors.foreground}
label-indicator-on-capslock = "  CL "
label-indicator-on-capslock-background = ${colors.background-alt}
label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}
[module/memory]
type = internal/memory
interval = 0.5
label = 
format = <ramp-used>
ramp-used-0 = 
ramp-used-1 = 
ramp-used-2 = 
ramp-used-3 = 
ramp-used-4 = 
ramp-used-5 = 
ramp-used-6 = 
ramp-used-7 = 
ramp-used-8 = 
ramp-used-9 = 
ramp-used-10 = 
ramp-used-11 = 
ramp-used-12 = 
ramp-used-13 = 
ramp-used-14 = 
ramp-used-15 = 
ramp-used-16 = 
ramp-used-0-foreground = #009933
ramp-used-1-foreground = #009933
ramp-used-2-foreground = #33cc33
ramp-used-3-foreground = #33cc33
ramp-used-4-foreground = #00ff00
ramp-used-5-foreground = #ccff66
ramp-used-6-foreground = #ffff00
ramp-used-7-foreground = #ffcc66
ramp-used-8-foreground = #ff8800
ramp-used-9-foreground = #ff5000
ramp-used-10-foreground = #ff0000
ramp-used-11-foreground = #ff0000
ramp-used-12-foreground = #ff00ff
ramp-used-13-foreground = #ff00ff
ramp-used-14-foreground = #ff00ff
ramp-used-15-foreground = #ff00ff
ramp-used-16-foreground = #ff00ff

[module/cpu]
type = internal/cpu
interval = 0.3
label = ""
format = <ramp-load>
ramp-load-0 = 
ramp-load-1 = 
ramp-load-2 = 
ramp-load-3 = 
ramp-load-4 = 
ramp-load-5 = 
ramp-load-6 = 
ramp-load-7 = 
ramp-load-8 = 
ramp-load-9 = 
ramp-load-0-foreground = #009933
ramp-load-1-foreground = #33cc33
ramp-load-2-foreground = #00ff00
ramp-load-3-foreground = #ccff66
ramp-load-4-foreground = #ffff00
ramp-load-5-foreground = #ffcc66
ramp-load-6-foreground = #ff8800
ramp-load-7-foreground = #ff5000
ramp-load-8-foreground = #ff0000
ramp-load-9-foreground = #ff00ff
[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = %{F#F0C674}%ifname%%{F#707880} disconnected

[module/wlan]
inherit = network-base
interface-type = wireless
ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤯
ramp-signal-2 = 󰤟
ramp-signal-3 = 󰤟
ramp-signal-4 = 󰤢
ramp-signal-5 = 󰤢
ramp-signal-6 = 󰤥
ramp-signal-7 = 󰤥
ramp-signal-8 = 󰤨
ramp-signal-9 = 󰤨
ramp-signal-0-foreground = #ff0000
ramp-signal-1-foreground = #ff5000
ramp-signal-2-foreground = #ff8800
ramp-signal-3-foreground = #ffcc66
ramp-signal-4-foreground = #ffff00
ramp-signal-5-foreground = #ccff66
ramp-signal-6-foreground = #00ff00
ramp-signal-7-foreground = #33cc33
ramp-signal-8-foreground = #009933
ramp-signal-9-foreground = #009933
label-disconnected-foreground = #ffffff
format-connected = <ramp-signal>
label-disconnected = 󰤮
interval = 1

[module/eth]
inherit = network-base
interface-type = wired
label-connected = %{F#F0C674}%ifname%%{F-} %local_ip%

[module/date]
type = internal/date
interval = 1
date-alt =  %d.%m.%y  %H:%M:%S
date =  %d.%m.%y  %H:%M
[module/archmenu]
type = custom/menu
#label-close = " Arch Linux x86_64 "
label-close = " "
label-open = "󰐥"
expand-right = true
menu-0-0 = "󰍃 "
menu-0-0-exec = "bspc quit"
menu-0-1 = "󰤁 "
menu-0-1-exec = systemctl poweroff
menu-0-2 = 󰑓
menu-0-2-exec = systemctl reboot
[module/mpd]
type = internal/mpd
format-paused = "󰝛 <label-song> <icon-single>"
format-stopped = "󰝛 Nothing <icon-single>"
format-online = "󰝚 <label-song> <icon-single>"
bar-progress-width = 10
bar-progress-indicator = |
bar-progress-fill = ━
bar-progress-empty = ─
interval = 1
icon-single = 󰑖
toggle-off-foreground=${colors.background}
label-song = "%title%"
[module/battery]
type = internal/battery
battery = BAT0
adapter = AC0
poll-interval = 1
full-at = 99
low-at = 10
label-full = "󰁹"
label-full-foreground = #009933
label-low = %percentage%%
label-charging =

animation-charging-0 = 󰢜
animation-charging-1 = 󰂆
animation-charging-2 = 󰂇
animation-charging-3 = 󰂈
animation-charging-4 = 󰢝
animation-charging-5 = 󰂉
animation-charging-6 = 󰢞
animation-charging-7 = 󰂊
animation-charging-8 = 󰂋
animation-charging-9 = 󰂅
animation-charging-framerate = 500

format-charging = <ramp-capacity>󱐋

ramp-capacity-0 = 󰂎
ramp-capacity-1 = 󰁺
ramp-capacity-2 = 󰁻
ramp-capacity-3 = 󰁼
ramp-capacity-4 = 󰁽
ramp-capacity-5 = 󰁾
ramp-capacity-6 = 󰁿
ramp-capacity-7 = 󰂀
ramp-capacity-8 = 󰂁
ramp-capacity-9 = 󰂂
ramp-capacity-10 = 󰁹
ramp-capacity-1-foreground = #cc0000
ramp-capacity-2-foreground = #ff0000
ramp-capacity-3-foreground = #ff5000
ramp-capacity-4-foreground = #ff8800
ramp-capacity-5-foreground = #ffcc66
ramp-capacity-6-foreground = #ffff00
ramp-capacity-7-foreground = #ccff66
ramp-capacity-8-foreground = #00ff00
ramp-capacity-9-foreground = #33cc33
ramp-capacity-10-foreground = #009933
animation-low-0 = "󰂃"
animation-low-1 = "󰁺"
animation-low-framerate = 500

format-low = <animation-low> <label-low>
format-discharging = <ramp-capacity>
format-low-foreground = #cc0000
[settings]
screenchange-reload = true
pseudo-transparency = true
; vim:ft=dosini
